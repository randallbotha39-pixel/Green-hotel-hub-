name: Build Green Hotel Hub APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          mkdir project
          unzip -q GreenHotelHubPhoneBuild.zip -d project

      - name: Find Android project
        id: find_project
        run: |
          ROOT=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Build APK
        working-directory: ${{ steps.find_project.outputs.root }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GreenHotelHub-APK
          path: ${{ steps.find_project.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
